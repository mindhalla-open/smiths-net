[package]
name         = "smiths-fuzz"
version      = "0.0.0"
publish      = false
edition      = "2024"
rust-version = "1.95"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary     = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
rsip          = "0.4"
smiths-sdp    = { path = "../crates/smiths-sdp" }
smiths-sip    = { path = "../crates/smiths-sip" }

[[bin]]
name              = "sip_parser"
path              = "fuzz_targets/sip_parser.rs"
test              = false
doc               = false
bench             = false
doctest           = false

[[bin]]
name              = "via_branch"
path              = "fuzz_targets/via_branch.rs"
test              = false
doc               = false
bench             = false
doctest           = false

[[bin]]
name              = "sdes_crypto"
path              = "fuzz_targets/sdes_crypto.rs"
test              = false
doc               = false
bench             = false
doctest           = false

[profile.release]
debug = 1
