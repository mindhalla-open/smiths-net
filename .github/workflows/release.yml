name: release

# Fires on version tags (`v*`). One multi-arch Docker build yields both
# deliverables:
#   - the image, pushed as `ghcr.io/<owner>/smiths-net:<version>`,
#     `:<major>.<minor>` and, for a non-prerelease tag, `:latest`;
#   - the static musl binaries for x86_64 and aarch64, exported from
#     the same build (Dockerfile `export` stage) and attached to the
#     GitHub release as tarballs plus a SHA256SUMS file.
# Adjust `REGISTRY` if the destination is not GitHub Container Registry.

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: multi-arch image + release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # release assets
      packages: write # ghcr.io push
    steps:
      - uses: actions/checkout@v4

      # The builder stage cross-compiles on the runner's own
      # architecture and the runtime stage only copies files, so no
      # stage executes arm64 code; emulation is a safety net for a
      # future RUN in the runtime stage, nothing more.
      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` comes from the semver flavor default
          # (`latest=auto`): added for stable tags such as v1.2.3,
          # skipped for pre-releases such as v1.2.3-rc1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache across release runs — musl builds are slow; the first
          # run warms, subsequent runs hit the cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same Dockerfile, same builder instance, `export` stage: the
      # builder layers are already in this job's buildx cache, so this
      # only copies the two binaries out as dist/linux_<arch>/smiths-net.
      - name: Export static binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: export
          outputs: type=local,dest=dist
          cache-from: type=gha

      - name: Package release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch="${pair%%:*}"
            triple="${pair#*:}"
            name="smiths-net-${version}-${triple}"
            mkdir "$name"
            install -m 0755 "dist/linux_${arch}/smiths-net" "$name/smiths-net"
            cp examples/config.toml "$name/config.toml.example"
            cp README.md LICENSE "$name/"
            tar -czf "${name}.tar.gz" "$name"
          done
          sha256sum smiths-net-*.tar.gz | tee SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            smiths-net-*.tar.gz
            SHA256SUMS
