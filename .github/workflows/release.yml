name: release

# Fires on version tags (`v*`). Builds and pushes a multi-arch Docker
# image under `ghcr.io/<owner>/smiths-net:<tag>` plus a `:latest` tag
# when the release is from the main branch. Adjust `REGISTRY` if the
# destination is not GitHub Container Registry.

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: multi-arch docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache across release runs — musl builds are slow; first
          # run warms, subsequent runs hit the registry cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: release binaries
    runs-on: ubuntu-latest
    needs: docker
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compile toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin smiths-net

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          NAME="smiths-net-${VERSION}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/smiths-net" "$NAME/"
          cp examples/config.toml "$NAME/config.toml.example"
          cp README.md LICENSE* "$NAME/" 2>/dev/null || true
          tar -czf "${NAME}.tar.gz" "$NAME"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: smiths-net-*.tar.gz
