name: fuzz-nightly

# Runs every `cargo-fuzz` target under `fuzz/` on a fresh nightly
# toolchain each night. GitHub-hosted runners cap a job at six hours,
# so each target gets about five hours of fuzzing (`FUZZ_SECS`) with
# slack for the coverage and upload steps; self-hosted runners can
# raise `timeout-minutes` and `FUZZ_SECS` together for longer
# campaigns. The corpus is carried between runs through the Actions
# cache so coverage accumulates instead of restarting from the seeds
# every night. libFuzzer exits non-zero on a crash, timeout or OOM
# input, which fails the job; the input is uploaded for triage (see
# fuzz/README.md).

on:
  schedule:
    # 02:00 UTC every day — a window that doesn't collide with the
    # main CI's usual push burst.
    - cron: "0 2 * * *"
  # Manual trigger for ad-hoc runs.
  workflow_dispatch:

env:
  # Seconds of fuzzing per target. Keep this comfortably below
  # `timeout-minutes` so the coverage + upload steps still run.
  FUZZ_SECS: 17700

jobs:
  fuzz:
    name: cargo-fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # Each target runs independently so a crash in one doesn't mask
      # useful coverage gains in the others.
      fail-fast: false
      matrix:
        target:
          - sip_parser
          - via_branch
          - sdes_crypto
    # The GitHub-hosted maximum.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz needs nightly for the sanitizer + coverage flags.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Restore the newest corpus for this target; the save step below
      # runs even when the fuzz step fails so a crash still leaves the
      # enlarged corpus behind.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          cargo fuzz run ${{ matrix.target }} \
            -- -max_total_time=${FUZZ_SECS} -timeout=60

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash inputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      # Replays the corpus through an instrumented build; the report
      # lands under fuzz/coverage/<target>/. Best effort — a coverage
      # hiccup must not hide the fuzz result.
      - name: Collect coverage
        if: always()
        working-directory: fuzz
        continue-on-error: true
        run: cargo fuzz coverage ${{ matrix.target }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.target }}
          path: fuzz/coverage/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
