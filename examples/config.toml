# Default smiths-net configuration. Everything is optional; the defaults
# below match what the engine uses when no config file is provided.
#
# Environment overrides use the prefix `SMITHS__` and `__` as section
# separator, e.g. `SMITHS__OBSERVABILITY__LOG_LEVEL=debug`.

[core]
# 0 = auto-detect (num_cpus). Set to a positive integer to pin.
worker_threads = 0

[observability]
# "trace" | "debug" | "info" | "warn" | "error"  (or any tracing-env-filter directive)
log_level = "info"

# "json" (production) | "pretty" (local dev)
log_format = "json"

# HTTP bind for the /health endpoint.
health_bind = "127.0.0.1:8080"

[sip]
# Socket addresses to bind for SIP. 0.0.0.0 = all interfaces.
bind = ["0.0.0.0:5060"]

# Enabled transports: "udp", "tcp", "tls". ("quic" is rejected by
# `smiths-net validate` — no build ships the QUIC listener.)
transports = ["udp"]

# Shutdown drain window (seconds): after SIGTERM the engine BYEs every
# live dialog and waits up to this long for the tables to empty before
# it cancels the SIP tasks. `SMITHS_DRAIN_SECS` overrides at runtime.
# Hot-reloadable.
drain_timeout_secs = 10

# RFC 4028 session timers. Every accepted INVITE negotiates a
# Session-Expires refresh; a dialog whose refresh never arrives is torn
# down. `min_se_secs` is the smallest interval accepted (RFC floor 90).
session_timer_enabled = true
session_expires_secs  = 1800
min_se_secs           = 90

# Hard ceiling on any dialog's lifetime, seconds. 0 = unlimited.
max_call_duration_secs = 0

# Conference rooms (slice 5.6e). When set, an INVITE whose Request-URI
# user-part starts with this prefix joins an N-party audio mixer (one
# participant per INVITE) instead of the classic 2-peer bridge — so
# `sip:conf-standup@engine` becomes a group call. Unset (the default)
# = every room bridges 2-peer as before. Pairs with the
# `smiths-softphone` client (`--room conf-standup`).
# conference_prefix = "conf"

# Outbound-connect proxy for SIP over TCP / TLS (slice 3.5 / P16).
# SOCKS5 and HTTP-CONNECT are stream protocols, so UDP can't ride
# them — UDP transports ignore this block.
[sip.proxy]
mode    = "none"              # "none" | "socks5" | "http-connect"
# address  = "127.0.0.1:9050"
# username = "alice"
# password = "s3cret"         # redacted in config://current

# Embedded WireGuard. No build brings the tunnel up in-process, so
# `mode = "wireguard"` is rejected by `smiths-net validate`; run
# WireGuard as a host sidecar (docs/deployment/vpn.md).
[sip.vpn]
mode = "none"                 # "none" | "wireguard"
# private_key     = "..."      # redacted in config://current
# peer_public_key = "..."
# peer_endpoint   = "203.0.113.7:51820"
# allowed_ips     = ["10.42.0.0/24"]
# interface_ip    = "10.42.0.5/24"

# Subscriber DB + digest-auth realm (P8 / slice 2.1).
# `backend = "none"` (default) keeps pre-v0.33.0 behaviour — REGISTER
# blindly 200s. `backend = "sqlite"` enables the embedded SQLite
# store; provision users out-of-band via `SqliteAuthStore::upsert_user`
# (CLI subcommand lands in a follow-on slice).
[auth]
backend = "none"          # "none" | "sqlite" | "http"
realm   = "smiths.local"

# [auth.sqlite]
# path = "/var/lib/smiths-net/auth.db"

# HTTP webhook backend (P8 / slice 2.2). The engine posts
# `{"realm","username","algorithm"}` to `endpoint`; the webhook
# returns `{"status":"accept","ha1":"<hex>"}` or `{"status":"deny"}`.
# `failure_mode = "fail_closed"` (default) denies every lookup while
# the circuit breaker is open; `"fail_open"` returns UnknownUser
# instead (suitable only when auth is optional).
# [auth.http]
# endpoint              = "https://iam.example.com/sip-auth"
# timeout_ms            = 2000
# retries               = 1
# bearer_token          = "s3cret-engine-token"
# breaker_threshold     = 5
# breaker_cooldown_secs = 30
# failure_mode          = "fail_closed"

# Pluggable storage (P23 / slice 2.3) — CDR + KV surfaces. Point at
# the same DB file as `[auth.sqlite]` to share one store across auth
# + registrations + call-detail-records + opaque KV.
[storage]
backend = "none"   # "none" | "sqlite"

# [storage.sqlite]
# path = "/var/lib/smiths-net/storage.db"

# Vector search (slice 3.4 / P23). `memory` is the in-process
# cosine-similarity store — loses every record on restart, good for
# dev loops. `sidecar` is rejected by `smiths-net validate` until the
# engine ships a sidecar adapter.
[storage.vector]
backend = "none"   # "none" | "memory"
# plugin  = "store-qdrant"

# Per-call audio retention (slice 3.4 / P23). `fs` writes
# <hex(call_id)>.wav files under `[storage.recording.fs] root`.
# Operators who enable it unlock the `call_id`-only path on
# `transcribe_call` / `summarize_call` (no more inline audio_base64).
[storage.recording]
backend        = "none"   # "none" | "fs"  ("sidecar" is rejected until an adapter exists)
retention_days = 0        # 0 disables the hourly sweeper; >0 deletes blobs older than N days
# plugin = "store-s3-recording"

# [storage.recording.fs]
# root = "/var/lib/smiths-net/recordings"

# Media-plane tunings. `inband_dtmf` (slice 2.5) runs the Goertzel
# detector on plaintext PCMU frames and surfaces keypresses on the
# bus as `SipEvent::Dtmf` alongside the always-on RFC 4733 path.
# Costs ~3k FLOPs per 20 ms frame per leg — off by default.
[media]
inband_dtmf = false

# RTP/RTCP media port window. Unset (default) = ephemeral OS-assigned
# ports — simplest, but you can't open a tidy firewall rule. Set a
# fixed range to pin media to known ports: RTP uses even ports, RTCP
# the odd `port + 1`, so each concurrent call consumes two ports
# (a 100-port window ≈ 50 simultaneous legs). Open this range as
# `udp/min-max` in the host firewall.
# [media.rtp_ports]
# min = 16384
# max = 16484

# IVR prompt library (slice 4.2 / P9). Point `root` at a directory
# of WAV files (PCM16 LE, mono) — IVR scripts reference prompts
# relative to this root (`prompts/welcome.wav`). Leave the root
# empty to disable the library; `record_prompt` returns NotFound
# in that case.
[media.prompts]
root     = ""
# capacity = 128

# Audio transcoding CPU budget (slice 5.3 / P12). Governs how many
# simultaneous calls the engine will accept that require codec
# conversion (Opus ↔ G.711). Calls past the cap get 488 Not
# Acceptable Here + `Warning: 370 transcode budget exhausted`.
# Default sizing assumes a 4-core box; raise `max_concurrent_calls`
# after observing `smiths_transcode_cpu_ms_total` under real traffic.
[media.transcode]
max_concurrent_calls   = 40
cpu_budget_ms_per_call = 50

# Cloud-AI secrets (slice 3.2 / P22). All fields optional — sidecars
# read their own API keys from environment variables (`OPENAI_API_KEY`,
# `ANTHROPIC_API_KEY`). This block exists so operators have one
# canonical home on disk + a redaction-tested surface. Values here are
# replaced with `"***"` in the `config://current` MCP resource.
[ai]
# openai_api_key    = "sk-..."
# anthropic_api_key = "sk-ant-..."

[plugins]
# Directory the loader scans at startup, recursing one level. Each
# directory holding a `plugin.toml` becomes one sidecar, WASM or
# script plugin; directories without one are containers and are
# skipped. Defaults to "plugins" (relative to cwd).
#
# This points at `plugins/examples` rather than `plugins` on purpose:
# `plugins/cookbook` is teaching material meant to be read (and built
# in CI), and several of its samples deliberately show manifests the
# loader rejects. Point `dir` at `plugins` only if you want those
# loaded too.
dir = "plugins/examples"

# Call-event hooks (slice 5.6e / P24). Plugins listed here are invoked
# automatically when a SIP dialog goes live: the engine calls each
# one's `on_dialog_created` method with params {call_id, remote_rtp}.
# Lets a call-control plugin (e.g. the `sip-client` example) react to
# inbound calls without an explicit MCP request. Empty = no consumer
# spawned.
call_event_hooks = []

# WASM-tier plugin limits. Applied to every `type = "wasm"` plugin
# instance the loader creates.
[plugins.wasm]
memory_limit_mb   = 64      # linear-memory ceiling per instance
invoke_timeout_ms = 5000    # per-call wall-clock budget

# Sidecar sandbox (v0.23.0). Every field is optional; omit or set to
# the default to leave that knob at "inherit". All are applied in the
# forked child right before `execve`, so limits are enforced by the
# kernel from the plugin's first instruction onward.
#
# Prod deployments should enable these; dev / tests can leave them
# empty (the default).
#
# Seccomp-BPF filtering and user-namespace isolation are tracked as a
# separate follow-on slice — out of scope for this section.
[plugins.sandbox]
# RLIMIT_NOFILE — max open file descriptors.
# max_fds = 256

# RLIMIT_AS in bytes — virtual-memory ceiling (best portable memory cap).
# max_memory_bytes = 536870912    # 512 MiB

# RLIMIT_CPU in seconds — kernel SIGXCPUs the child on overrun.
# max_cpu_seconds = 60

# RLIMIT_NPROC — additional processes the plugin can spawn.
# Set to 0 to forbid fork()/exec() from the plugin entirely.
# max_processes = 0

# Linux only: prctl(PR_SET_NO_NEW_PRIVS, 1) — blocks privilege
# escalation via setuid binaries / file capabilities. Silently
# skipped on macOS / BSD.
# no_new_privs = true

# Seccomp-BPF syscall filter (Linux only, v0.29.0+).
#   "off"        — no filter (default, same as pre-v0.29.0).
#   "allowlist"  — install the curated baseline + extras below;
#                  everything else returns EPERM.
# See docs/operator-runbook.md for the rationale behind the
# baseline list.
# seccomp = "allowlist"

# Optional per-plugin extras on top of the allowlist baseline.
# Each entry is a syscall name; unknown names fail fast at spawn.
# seccomp_extra_allow = ["io_uring_setup", "io_uring_enter", "io_uring_register"]


# MCP over HTTP (`[mcp] enabled_http = true`). stdio MCP is always
# available via `--mcp stdio`.
[mcp]
enabled_http = false
http_bind    = "127.0.0.1:7878"

# Bearer token every MCP HTTP request must carry
# (`Authorization: Bearer <token>`). Unset = no auth — loopback only.
[mcp.http]
# bearer_token = "s3cret"

# Config hot-reload. SIGHUP (or `smiths-net reload --pid N`) re-reads
# the config file and applies every hot-reloadable field; fields that
# need a restart are refused and reported. Both knobs are themselves
# hot-reloadable.
[reload]
enabled         = true    # false = SIGHUP is logged and ignored
max_frequency_s = 10      # refuse reloads arriving faster than this

# Canary window for every applied reload: the change rolls back on its
# own unless confirmed (MCP `confirm_config`) before `deadline_s`, or
# earlier if an error-rate probe trips.
[canary]
deadline_s                       = 300
plugin_error_rate_ceiling        = 0.5   # 1.0 disables
sip_parse_errors_per_sec_ceiling = 10    # 18446744073709551615 disables

# WebRTC-native signaling adapter: plain-HTTP WebSocket at ws_bind,
# DTLS-SRTP media, tag-based rendezvous with SIP legs. Front it with a
# TLS terminator for wss:// — `tls_cert` / `tls_key` are rejected.
[webrtc]
enabled = false
ws_bind = "127.0.0.1:7881"

# Privacy posture (hot-reloadable). "relay_only" rejects host/srflx
# candidates; "strict" additionally redacts peer IPs and requires TLS
# signaling, which this adapter cannot terminate — use "relay_only"
# behind a TLS proxy.
[webrtc.privacy]
mode          = "open"     # "open" | "relay_only" | "strict"
redaction_key = ""

# ICE-lite candidates on every answer. `stun_servers` are queried (one
# Binding request each, 1 s timeout) for server-reflexive candidates.
[webrtc.ice]
enabled      = false
host_binds   = []
stun_servers = []          # e.g. ["203.0.113.5:3478"]

# Embedded TURN server, or `external_url` to hand clients an existing
# coturn instead.
[webrtc.turn]
enabled               = false
bind                  = "0.0.0.0:3478"
realm                 = ""
allocation_lifetime_s = 600
credentials           = []
external_url          = ""

# HA dialog replication. A primary binds its replication listener on
# `peer_addr`; a secondary dials the primary there. On every secondary
# (re)connect the primary sends a full dialog snapshot, then streams
# deltas; a dropped delta or failed write triggers a snapshot resync.
[cluster]
# "standalone"  — single node, no replication.
# "primary"     — streams dialog deltas to one secondary (peer_addr = bind).
# "secondary"   — replays deltas from the primary (peer_addr = its address).
# "raft"        — the dialog table is a replicated state machine; survives
#                 the loss of any single node. Uses raft_addr / node_id /
#                 raft_dir / initial_peers below, not peer_addr.
mode                    = "standalone"
# peer_addr             = "10.42.0.10:8000"   # required for primary/secondary
heartbeat_interval_secs = 5                   # hot-reloadable

# --- raft mode only ---
# raft_addr     = "10.42.0.10:8100"   # inter-node Raft RPC bind (required)
# node_id       = 1                   # unique per node
# raft_dir      = "/var/lib/smiths/raft"
# initial_peers = ["1@10.42.0.10:8100", "2@10.42.0.11:8100", "3@10.42.0.12:8100"]
