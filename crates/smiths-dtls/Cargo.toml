[package]
name         = "smiths-dtls"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "DTLS-SRTP handshake state machine wrapping webrtc-dtls for smiths-net."

[dependencies]
smiths-core = { workspace = true }
smiths-sdp  = { workspace = true }

webrtc-dtls = { workspace = true, features = ["pem"] }
# Pinned to 0.11.0 intentionally — webrtc-dtls 0.12 uses this exact
# version transitively, and the KeyingMaterialExporter trait + Conn
# trait must resolve to the SAME crate instance for `DTLSConn` to
# implement them visibly here. Bumping without also bumping
# webrtc-dtls breaks compilation at `export_keying_material`.
webrtc-util = "=0.11.0"
rustls      = { workspace = true }

tokio       = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
sha2        = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
