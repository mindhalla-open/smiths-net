[package]
name         = "smiths-sip"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "RFC 3261 SIP signaling: transport, parser, transactions, dialogs, auth."

[features]
# On by default so the single-binary dev experience stays "it just
# works". Opt out with `default-features = false` on the dep line to
# drop the SQLite / bundled-libsqlite compile cost.
default      = ["auth-sqlite", "auth-http"]
# Enables `auth::sqlite_store::SqliteAuthStore`, the embedded-SQLite
# `CredentialStore` + `RegistrationStore` backend.
auth-sqlite  = ["dep:rusqlite"]
# Enables `auth::http_store::HttpAuthStore`, a `CredentialStore`
# backed by an operator-provided HTTPS webhook.
auth-http    = ["dep:reqwest"]
# Slice 4.3 / P17: SIP-over-QUIC transport scaffold. Off by
# default; 0.45.0 ships the config surface + a `Transport`
# skeleton that logs a clear "not yet wired" warning at bind.
# The runtime (`quinn` listener, per-peer stream management) is
# a dedicated follow-on — turning the flag on today gives
# operators a supported config shape + `--version` advertisement
# without silently binding anywhere.
sip-quic     = []
# Slice 5.7 / P19: WebTransport signaling scaffold. Off by
# default. Enables the config surface + `WebTransportListener`
# trait + signaling protocol types. The actual QUIC runtime
# (quinn + h3-webtransport) is a follow-on slice — turning the
# flag on today gives operators a supported config shape and
# `--version` advertisement without silently binding anywhere.
# Matches the `sip-quic` + `mcp-http3` scaffold pattern.
webtransport = []

[dependencies]
smiths-core    = { workspace = true }
async-trait    = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }
bytes          = { workspace = true }
rsip           = { workspace = true }
dashmap        = { workspace = true }
md-5           = { workspace = true }
sha2           = { workspace = true }
hex            = { workspace = true }
base64         = { workspace = true }
rustls         = { workspace = true }
tokio-rustls   = { workspace = true }
rustls-pemfile = { workspace = true }
tracing        = { workspace = true }
thiserror      = { workspace = true }
rusqlite       = { workspace = true, optional = true }
reqwest        = { workspace = true, optional = true }
serde          = { workspace = true }
serde_json     = { workspace = true }

[dev-dependencies]
# Integration tests wire the real media + SDP implementations through
# the trait seams defined in `smiths-core` — the `smiths-sip` crate
# itself depends only on those seams.
smiths-media   = { workspace = true }
smiths-sdp     = { workspace = true }
smiths-testkit = { workspace = true }
base64         = { workspace = true }
rcgen          = { workspace = true }
tempfile       = { workspace = true }
tokio          = { workspace = true, features = ["macros", "test-util"] }
# `axum` powers the slice-2.2 mock webhook server used by
# `tests/register_http.rs`. Kept as a dev-only dep so the main
# smiths-sip build doesn't grow an axum transitive.
axum           = { workspace = true }

[lints]
workspace = true
