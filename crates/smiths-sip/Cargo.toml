[package]
name         = "smiths-sip"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "RFC 3261 SIP signaling: transport, parser, transactions, dialogs, auth."

[dependencies]
smiths-core    = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }
bytes          = { workspace = true }
rsip           = { workspace = true }
dashmap        = { workspace = true }
md-5           = { workspace = true }
sha2           = { workspace = true }
hex            = { workspace = true }
rustls         = { workspace = true }
tokio-rustls   = { workspace = true }
rustls-pemfile = { workspace = true }
tracing        = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
# Integration tests wire the real media + SDP implementations through
# the trait seams defined in `smiths-core` — the `smiths-sip` crate
# itself depends only on those seams.
smiths-media = { workspace = true }
smiths-sdp   = { workspace = true }
rcgen        = { workspace = true }
tempfile     = { workspace = true }
tokio        = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
