[package]
name         = "smiths-cli"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "smiths-net binary: CLI, config loading, and subsystem wiring."

[[bin]]
name = "smiths-net"
path = "src/main.rs"

[features]
# Slice 3.5 / P16. Turns on the config surface for the embedded
# `boringtun` WireGuard device. Runtime plumbing (creating the
# tun/tap interface, binding SIP against it) is a dedicated
# follow-on — today the feature accepts the config and logs a
# warning at startup, so deployments that enable it get a clear
# signal rather than silent fallthrough. Off by default because
# most operators run WireGuard as a host sidecar (see
# docs/deployment/vpn.md).
default   = []
wireguard = []

# Slice 4.3 / P17 scaffolds. Enabling these flips `--version` to
# advertise the protocol + lets the matching config section parse.
# Runtime listeners (QUIC for SIP-over-QUIC, quinn+h3 for MCP h3)
# land in follow-on slices; the config surface + version bump ship
# now so operators can pin the intended shape and CI matrices can
# start exercising the feature builds.
mcp-http3 = ["smiths-mcp/mcp-http3"]
sip-quic  = ["smiths-sip/sip-quic"]

[dependencies]
smiths-core        = { workspace = true }
const_format       = "0.2"
smiths-sip         = { workspace = true }
smiths-sdp         = { workspace = true }
smiths-media       = { workspace = true }
smiths-mcp         = { workspace = true }
smiths-plugin      = { workspace = true }
tokio              = { workspace = true }
tokio-util         = { workspace = true }
axum               = { workspace = true }
clap               = { workspace = true }
prometheus-client  = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }

[dev-dependencies]
tokio      = { workspace = true, features = ["macros", "test-util"] }
serde_json = { workspace = true }
tempfile   = { workspace = true }

[lints]
workspace = true
