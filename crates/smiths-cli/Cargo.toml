[package]
name         = "smiths-cli"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "smiths-net binary: CLI, config loading, and subsystem wiring."

[[bin]]
name = "smiths-net"
path = "src/main.rs"

[features]
# Slice 3.5 / P16. Turns on the config surface for the embedded
# `boringtun` WireGuard device. Runtime plumbing (creating the
# tun/tap interface, binding SIP against it) is a dedicated
# follow-on — today the feature accepts the config and logs a
# warning at startup, so deployments that enable it get a clear
# signal rather than silent fallthrough. Off by default because
# most operators run WireGuard as a host sidecar (see
# docs/deployment/vpn.md).
default   = []
wireguard = []

# Slice 4.3 / P17 scaffolds. Enabling these flips `--version` to
# advertise the protocol + lets the matching config section parse.
# Runtime listeners (QUIC for SIP-over-QUIC, quinn+h3 for MCP h3)
# land in follow-on slices; the config surface + version bump ship
# now so operators can pin the intended shape and CI matrices can
# start exercising the feature builds.
mcp-http3 = ["smiths-mcp/mcp-http3"]
sip-quic  = ["smiths-sip/sip-quic"]

[dependencies]
smiths-core        = { workspace = true }
const_format       = "0.2"
# `webtransport` feature is required so the WebRTC-native signaling
# listener (slice 5.10) sees the shared `WtSignal` JSON frame type.
smiths-sip         = { workspace = true, features = ["webtransport"] }
async-trait        = { workspace = true }
smiths-sdp         = { workspace = true }
smiths-media       = { workspace = true }
smiths-mcp         = { workspace = true }
smiths-plugin      = { workspace = true }
smiths-transcode   = { workspace = true }
# Slice 5.10-dtls: thread `DtlsLegConfig` + `DtlsRole` into the
# handler so the WebRTC adapter can drive the fabric's
# handshake off the negotiator's `DtlsParams`.
smiths-dtls        = { workspace = true }
# Slice 5.11-turn: the CLI owns the embedded TURN server's
# lifecycle (bind + cancel on shutdown) — the server itself
# lives in smiths-ice.
smiths-ice         = { workspace = true }
tokio              = { workspace = true }
tokio-util         = { workspace = true }
axum               = { workspace = true, features = ["ws"] }
clap               = { workspace = true }
dashmap            = { workspace = true }
prometheus-client  = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
# Slice 5.8-c: `smiths-net reload` uses `rustix::process::kill_process`
# to deliver SIGHUP to a running engine. `smiths-sidecar` already
# pulls rustix through the workspace pin (v1.1) for sandbox
# `apply_in_child`; reusing the same pin keeps the feature matrix
# small.
rustix             = { workspace = true }

[dev-dependencies]
tokio      = { workspace = true, features = ["macros", "test-util"] }
serde_json = { workspace = true }
tempfile   = { workspace = true }

[lints]
workspace = true
