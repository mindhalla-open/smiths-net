[package]
name         = "smiths-mcp"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "Control plane: Tool/Resource traits plus MCP (stdio) and A2A (HTTP) adapters."

[features]
# Slice 4.3 / P17: HTTP/3 (quinn + h3) transport for the MCP HTTP
# adapter. Off by default; the 0.45.0 release ships the config
# surface + a scaffold advertisement — the runtime QUIC listener
# lands in a dedicated follow-on once the ALPN + cert story has
# a concrete operator ask. Enabling the feature today flips
# `--version` to include `h3` in the protocol list + lets a
# `[mcp.http3]` config block parse; it does NOT open a listener.
default   = []
mcp-http3 = []

[dependencies]
smiths-core   = { workspace = true }
smiths-media  = { workspace = true }
smiths-mixer  = { workspace = true }
base64        = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }
futures       = { workspace = true }
tokio         = { workspace = true }
tokio-stream  = { workspace = true }
tokio-util    = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tracing       = { workspace = true }
thiserror     = { workspace = true }
axum          = { workspace = true }
dashmap       = { workspace = true }
prometheus-client = { workspace = true }

[dev-dependencies]
smiths-plugin     = { workspace = true }
smiths-sdp        = { workspace = true }
smiths-sip        = { workspace = true }
smiths-testkit    = { workspace = true }
async-trait       = { workspace = true }
prometheus-client = { workspace = true }
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tempfile          = { workspace = true }
tokio             = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
