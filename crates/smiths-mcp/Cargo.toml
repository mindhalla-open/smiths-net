[package]
name         = "smiths-mcp"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "Control plane: Tool/Resource traits plus MCP (stdio) and A2A (HTTP) adapters."

[dependencies]
smiths-core   = { workspace = true }
base64        = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }
futures       = { workspace = true }
tokio         = { workspace = true }
tokio-stream  = { workspace = true }
tokio-util    = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tracing       = { workspace = true }
thiserror     = { workspace = true }
axum          = { workspace = true }
dashmap       = { workspace = true }

[dev-dependencies]
smiths-media      = { workspace = true }
smiths-plugin     = { workspace = true }
smiths-sdp        = { workspace = true }
smiths-sip        = { workspace = true }
smiths-testkit    = { workspace = true }
async-trait       = { workspace = true }
prometheus-client = { workspace = true }
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tempfile          = { workspace = true }
tokio             = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
