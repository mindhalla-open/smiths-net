[package]
name         = "smiths-sidecar"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "Sidecar plugin host: subprocess supervisor and JSON-RPC IPC over stdio."

[dependencies]
smiths-core = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Safe POSIX syscall wrappers for the sandbox `pre_exec` path
# (`setrlimit`, Linux `prctl(PR_SET_NO_NEW_PRIVS)`). Unix-only —
# Windows ports would need a different story (JobObjects).
rustix = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["macros", "test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
