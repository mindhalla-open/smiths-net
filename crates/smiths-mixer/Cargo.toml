[package]
name         = "smiths-mixer"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "N:N audio conferencing mixer: jitter-buffered ingress, leave-one-out sum + AGC + VAD, MixerFabric."

[dependencies]
smiths-core  = { workspace = true }
smiths-media = { workspace = true }
smiths-sip   = { workspace = true }
async-trait  = { workspace = true }
dashmap      = { workspace = true }
prometheus-client = { workspace = true }
# Random initial RTP sequence number / timestamp per RFC 3550 §5.1.
rand         = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true, features = ["net", "rt", "sync", "macros", "time"] }
tokio-util   = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
