[package]
name         = "smiths-proto"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "Wire schema shared by core, WASM plugins, and sidecar plugins."

[features]
# On by default; surfaces the `fixed_frame` module and
# `FixedFrameWireFormat` — a hand-rolled fixed-offset binary layout
# (zero-copy reads, no unsafe, no build.rs). Needs `std`; turn it
# off for `no_std` consumers.
default     = ["fixed-frame"]
fixed-frame = []

[dependencies]
prost = { workspace = true }

[lints]
workspace = true
