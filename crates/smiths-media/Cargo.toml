[package]
name         = "smiths-media"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "UDP media plane: SSRC-rewriting RTP bridge with SRTP/SRTCP and terminated RTCP, adaptive jitter buffer, transcoded session."

[features]
default = []
# Per-call packet-capture tap writing `<observability.pcap_dir>/
# <call-id>.pcap`. Off by default because `pcap-file` pulls in a
# non-trivial dependency chain; enable in release builds that need
# offline triage.
pcap = []

[dependencies]
smiths-core      = { workspace = true }
smiths-dtls      = { workspace = true }
smiths-sdp       = { workspace = true }
smiths-transcode = { workspace = true }
tokio            = { workspace = true }
tokio-util  = { workspace = true }
async-trait = { workspace = true }
dashmap     = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
webrtc-srtp = { workspace = true }
# The bridge resolves its Prometheus counter handles once per task
# instead of looking labels up per packet.
prometheus-client = { workspace = true }
# A peer-bound `Conn` adapter around the fabric's UDP socket for the
# DTLS handshake. Re-use the transitive version `webrtc-dtls` already
# pins so there's no duplicate webrtc-util in the graph.
webrtc-util = "0.11"

[dev-dependencies]
tokio             = { workspace = true, features = ["macros", "test-util"] }
tempfile          = { workspace = true }
# End-to-end DTLS tests need live DTLS leg pairs.
smiths-dtls       = { workspace = true }
smiths-sdp        = { workspace = true }

[lints]
workspace = true
