[package]
name         = "smiths-media"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "RTP/RTCP session, jitter buffer, media router (passthrough)."

[features]
default = []
# Per-call packet-capture tap writing `<observability.pcap_dir>/
# <call-id>.pcap`. Off by default because `pcap-file` pulls in a
# non-trivial dependency chain; enable in release builds that need
# offline triage.
pcap = []

[dependencies]
smiths-core      = { workspace = true }
smiths-dtls      = { workspace = true }
smiths-sdp       = { workspace = true }
smiths-transcode = { workspace = true }
tokio            = { workspace = true }
tokio-util  = { workspace = true }
async-trait = { workspace = true }
dashmap     = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
webrtc-srtp = { workspace = true }
# Slice 5.10-dtls: a peer-bound `Conn` adapter around the fabric's
# UDP socket. Re-use the transitive version `webrtc-dtls` already
# pins so there's no duplicate webrtc-util in the graph.
webrtc-util = "0.11"

[dev-dependencies]
tokio             = { workspace = true, features = ["macros", "test-util"] }
tempfile          = { workspace = true }
# Slice 5.10-dtls end-to-end tests need live DTLS leg pairs +
# a Prometheus registry to verify the outcome-label counters.
smiths-dtls       = { workspace = true }
smiths-sdp        = { workspace = true }
prometheus-client = { workspace = true }

[lints]
workspace = true
