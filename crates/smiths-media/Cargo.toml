[package]
name         = "smiths-media"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "RTP/RTCP session, jitter buffer, media router (passthrough)."

[features]
default = []
# Per-call packet-capture tap writing `<observability.pcap_dir>/
# <call-id>.pcap`. Off by default because `pcap-file` pulls in a
# non-trivial dependency chain; enable in release builds that need
# offline triage.
pcap = []

[dependencies]
smiths-core      = { workspace = true }
smiths-transcode = { workspace = true }
tokio            = { workspace = true }
tokio-util  = { workspace = true }
async-trait = { workspace = true }
dashmap     = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
webrtc-srtp = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["macros", "test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
