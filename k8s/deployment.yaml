apiVersion: apps/v1
kind: Deployment
metadata:
  name: smiths-net
  labels:
    app.kubernetes.io/name: smiths-net
    app.kubernetes.io/component: signaling
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smiths-net
  # Rolling update one at a time — SIP dialogs don't tolerate sudden
  # pod loss, and the graceful drain (SIGTERM → 503 on new INVITEs)
  # needs a few seconds to complete.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smiths-net
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # On SIGTERM the engine answers new INVITEs with 503 +
      # Retry-After: 0 for SMITHS_DRAIN_SECS (set below; the binary's
      # default is 5 s), then cancels its tasks and exits. The grace
      # period must exceed the drain window with room for shutdown.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smiths-net
          image: ghcr.io/mindhalla-open/smiths-net:latest
          imagePullPolicy: IfNotPresent
          env:
            # Seconds of 503-drain before the process exits; the only
            # drain knob the engine reads.
            - name: SMITHS_DRAIN_SECS
              value: "10"
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
            # Only listens once the ConfigMap enables TLS with a bind
            # entry on this port (see k8s/configmap.yaml).
            - name: sip-tls
              containerPort: 5061
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          # CAP_NET_BIND_SERVICE isn't needed — the container runs
          # unprivileged ports (>1024 by default) via the Service's
          # LoadBalancer mapping if you front it that way.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            # /health answers 200 for the whole process lifetime —
            # during the drain window the JSON body carries
            # "draining": true, which an httpGet probe cannot see. New
            # traffic stops anyway: Kubernetes drops a terminating pod
            # from the Service endpoints, and the engine itself
            # refuses new INVITEs with 503 while draining.
            failureThreshold: 2
          volumeMounts:
            - name: config
              mountPath: /etc/smiths-net
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: smiths-net-config
            items:
              - key: config.toml
                path: config.toml
