apiVersion: apps/v1
kind: Deployment
metadata:
  name: smiths-net
  labels:
    app.kubernetes.io/name: smiths-net
    app.kubernetes.io/component: signaling
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smiths-net
  # Rolling update with one-at-a-time — SIP dialogs don't tolerate
  # sudden pod loss, and graceful drain (SIGTERM → 503) needs a few
  # seconds to complete.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smiths-net
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Give drain enough time — default grace is 30 s, smiths-net
      # drains for 10 s then exits; cushion the difference.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smiths-net
          image: ghcr.io/mindhalla/smiths-net:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
            - name: sip-tls
              containerPort: 5061
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          # CAP_NET_BIND_SERVICE isn't needed — the container runs
          # unprivileged ports (>1024 by default) via the Service's
          # LoadBalancer mapping if you front it that way.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            # Readiness flips to false the moment SIGTERM lands (the
            # drain flag gates /health's `ready` subfield). Load
            # balancers stop sending new traffic; live calls finish.
            failureThreshold: 2
          volumeMounts:
            - name: config
              mountPath: /etc/smiths-net
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: smiths-net-config
            items:
              - key: config.toml
                path: config.toml
