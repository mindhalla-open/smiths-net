[package]
name         = "canonical-hook"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
publish      = false
description  = "Full ABI WASM plugin — describe + alloc + invoke + run."

# Independent workspace root.
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto           = true
codegen-units = 1
opt-level     = "s"
strip         = "symbols"
