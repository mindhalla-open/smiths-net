[package]
name         = "call-control"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
publish      = false
description  = "Call-control WASM plugin — place calls via smiths::originate and react to inbound calls. Cookbook recipe."

# Independent workspace root.
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto           = true
codegen-units = 1
opt-level     = "s"
strip         = "symbols"
