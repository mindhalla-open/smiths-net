[package]
name         = "multi-tool"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
publish      = false
description  = "WASM plugin exposing multiple tools — cookbook recipe."

[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto           = true
codegen-units = 1
opt-level     = "s"
strip         = "symbols"
