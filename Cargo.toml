[workspace]
resolver = "3"
members  = ["crates/*"]
exclude  = ["fuzz"]

[workspace.package]
edition      = "2024"
rust-version = "1.85"
version      = "0.57.0"
license      = "Apache-2.0"

[workspace.lints.rust]
# `deny` (not `forbid`) so legitimate uses of `unsafe {}` can carry a
# crate-local `#[allow(unsafe_code)]` with a justification comment.
# Today the only such callsite is `smiths-sidecar`'s sandbox-attach
# path, which must invoke `CommandExt::pre_exec` (an `unsafe fn` in
# std with no safe alternative short of shipping a second binary).
# Every other crate is still unsafe-free by policy — the lint fires
# at `warn`+`deny` unless a file explicitly allows.
unsafe_code      = "deny"
unreachable_pub  = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic                = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

# --- Prospective hardening (v0.21.0) ---
# Zero current fires workspace-wide — enforce going forward so stray
# debug prints, `todo!`s, or `dbg!` macros can't land unnoticed.
# `unwrap_used` / `missing_docs` are the big-ticket items from the
# Phase 6 hardening list; they're tracked for a dedicated slice.
dbg_macro     = "warn"
print_stdout  = "warn"
print_stderr  = "warn"
todo          = "warn"
unimplemented = "warn"

[workspace.dependencies]
# async runtime
tokio       = { version = "1.41", features = ["full"] }
tokio-util  = { version = "0.7",  features = ["rt"] }
async-trait = "0.1"

# web framework (health endpoint, later MCP/HTTP)
# HTTP/1.1 + HTTP/2 both on by default (slice 4.3 / P17). The h2
# feature brings in `h2` + friends; cost is ~150 KiB of code. When
# the operator fronts the MCP HTTP adapter with a TLS-terminator
# that negotiates ALPN (nginx / Envoy / Caddy), connections upgrade
# transparently. No client-side changes needed for h1-only agents.
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "json"] }

# config
figment = { version = "0.10", features = ["toml", "env"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# serde
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# errors
thiserror = "2"
anyhow    = "1"

# SIP
rsip    = "0.4"
bytes   = "1"
dashmap = "6"
md-5    = "0.11.0"
sha2    = "0.11.0"
hex     = "0.4"

# WASM host
wasmtime = { version = "44.0.0", default-features = false, features = ["cranelift", "runtime"] }
wat      = "1"

# Wire schema (prost without build.rs — derives only)
prost       = { version = "0.14.3", default-features = false, features = ["std", "derive"] }
prost-types = { version = "0.14.3" }

# Filesystem watching (hot reload for plugin dirs)
notify = "8.2.0"

# SRTP (built-in, not a plugin — per-packet crypto on the bridge hot
# path). Pure Rust, no libsrtp FFI, MIT/Apache-2.0.
webrtc-srtp = "0.17"

# DTLS-SRTP handshake. Pure-Rust wrapper; we seed it with our own
# rcgen-minted cert so slice 1.2's `SelfSignedCert` is what the peer
# sees in the fingerprint.
# `webrtc-util` is NOT a workspace dep — smiths-dtls pins it to match
# webrtc-dtls's transitive version inside its own Cargo.toml so the
# KeyingMaterialExporter trait resolves to the same instance
# webrtc-dtls implements. Do not add webrtc-util here.
webrtc-dtls = "0.12"

# CSPRNG — engine-side SDES key generation.
rand = "0.10.1"

# POSIX syscall wrappers used in sidecar sandboxing (`setrlimit`,
# Linux `prctl(PR_SET_NO_NEW_PRIVS)`). Pure-Rust wrappers so we
# keep `unsafe_code = "forbid"` at the workspace level.
rustix = { version = "1.1", features = ["process", "thread"] }

# TLS
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls   = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen          = "0.14"

# Metrics
prometheus-client = "0.24.1"

# audio helpers
base64 = "0.22"

# async stream utilities (SSE bridge)
tokio-stream = { version = "0.1", features = ["sync"] }
futures      = "0.3"

# test helpers
tempfile = "3"

# Embedded SQLite for the subscriber DB (P8 / slice 2.1). `bundled`
# compiles sqlite3.c alongside us so operators don't need a system
# libsqlite3; adds ~1 MB to the binary, which is cheap compared to
# the operational wins of a single-binary distribution.
rusqlite = { version = "0.39.0", features = ["bundled"] }

# HTTP client for the webhook `CredentialStore` (P8 / slice 2.2).
# `rustls-tls` avoids a system OpenSSL dep so musl builds stay
# self-contained. `json` flips on `serde_json` helpers so the
# request/response DTOs round-trip ergonomically. No default
# features — we don't need cookies / gzip / multipart.
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"] }

# internal crates
smiths-core      = { path = "crates/smiths-core" }
smiths-proto     = { path = "crates/smiths-proto" }
smiths-sip       = { path = "crates/smiths-sip" }
smiths-sdp       = { path = "crates/smiths-sdp" }
smiths-dtls      = { path = "crates/smiths-dtls" }
smiths-ice       = { path = "crates/smiths-ice" }
smiths-media     = { path = "crates/smiths-media" }
smiths-plugin    = { path = "crates/smiths-plugin" }
smiths-wasm      = { path = "crates/smiths-wasm" }
smiths-script    = { path = "crates/smiths-script" }
smiths-sidecar   = { path = "crates/smiths-sidecar" }
smiths-mcp       = { path = "crates/smiths-mcp" }
smiths-testkit   = { path = "crates/smiths-testkit" }
smiths-transcode = { path = "crates/smiths-transcode" }
smiths-fax       = { path = "crates/smiths-fax" }
smiths-mixer     = { path = "crates/smiths-mixer" }

# Embedded DSL (slice 4.1 / P24). Rhai is a tiny scripting language
# designed for embedding into Rust hosts — no unsafe, no FFI, a
# native op-count budget knob that lets the engine bound a
# malformed / adversarial script.
rhai           = { version = "1.18", features = ["sync"] }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
