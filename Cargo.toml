[workspace]
resolver = "3"
members  = ["crates/*"]
exclude  = ["fuzz"]

[workspace.package]
edition      = "2024"
rust-version = "1.85"
version      = "0.8.0"
license      = "Apache-2.0"

[workspace.lints.rust]
unsafe_code      = "forbid"
unreachable_pub  = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic                = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

[workspace.dependencies]
# async runtime
tokio       = { version = "1.41", features = ["full"] }
tokio-util  = { version = "0.7",  features = ["rt"] }
async-trait = "0.1"

# web framework (health endpoint, later MCP/HTTP)
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }

# config
figment = { version = "0.10", features = ["toml", "env"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# serde
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# errors
thiserror = "2"
anyhow    = "1"

# SIP
rsip    = "0.4"
bytes   = "1"
dashmap = "6"
md-5    = "0.11.0"
sha2    = "0.11.0"
hex     = "0.4"

# WASM host
wasmtime = { version = "43", default-features = false, features = ["cranelift", "runtime"] }
wat      = "1"

# TLS
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls   = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen          = "0.14"

# Metrics
prometheus-client = "0.24.1"

# audio helpers
base64 = "0.22"

# async stream utilities (SSE bridge)
tokio-stream = { version = "0.1", features = ["sync"] }
futures      = "0.3"

# test helpers
tempfile = "3"

# internal crates
smiths-core    = { path = "crates/smiths-core" }
smiths-proto   = { path = "crates/smiths-proto" }
smiths-sip     = { path = "crates/smiths-sip" }
smiths-sdp     = { path = "crates/smiths-sdp" }
smiths-media   = { path = "crates/smiths-media" }
smiths-plugin  = { path = "crates/smiths-plugin" }
smiths-wasm    = { path = "crates/smiths-wasm" }
smiths-script  = { path = "crates/smiths-script" }
smiths-sidecar = { path = "crates/smiths-sidecar" }
smiths-mcp     = { path = "crates/smiths-mcp" }
smiths-testkit = { path = "crates/smiths-testkit" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
